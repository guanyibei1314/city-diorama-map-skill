<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Xiamen city diorama map style preview</title>
  <desc id="desc">Vintage paper map with a miniature 3D Xiamen city, Gulangyu, mountains, water, landmarks and tilt-shift inspired depth.</desc>
  <defs>
